<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Desk — Expenses Dashboard">
  <!-- README banner in the ADR-0007 identity: Flap Black field, aurora glow, board grid, glass panel
       (16 px corners), Signal Green series, Cancel Red only for the over-budget bar, mono tabular figures.
       Mark copied from apps/web/public/icons/desk-mark.svg. -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f2f2ee" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e1114" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#0e1114" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa57a"/>
      <stop offset="1" stop-color="#2c7452"/>
    </linearGradient>
    <linearGradient id="over" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="1" stop-color="#d94b4b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3440"/>
      <stop offset="1" stop-color="#1a1e27"/>
    </linearGradient>
    <linearGradient id="cell-low" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a22"/>
      <stop offset="1" stop-color="#0c0e13"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfe4ec"/>
      <stop offset="1" stop-color="#9aa3b2"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0e1114"/>
    <!-- aurora -->
    <g filter="url(#blur)">
      <ellipse cx="900" cy="80" rx="260" ry="120" fill="#2c7452" opacity="0.55"/>
      <ellipse cx="1080" cy="300" rx="220" ry="110" fill="#344eaa" opacity="0.45"/>
      <ellipse cx="180" cy="340" rx="240" ry="90" fill="#2c7452" opacity="0.18"/>
    </g>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#fade)"/>
    <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#f2f2ee" stroke-opacity="0.08"/>
  </g>

  <!-- mark + wordmark -->
  <g transform="translate(72 62) scale(1.5)">
    <rect width="48" height="48" rx="11" fill="url(#cell)"/>
    <path d="M0 24 H48 V37 A11 11 0 0 1 37 48 H11 A11 11 0 0 1 0 37 Z" fill="url(#cell-low)"/>
    <rect x="4" y="0.6" width="40" height="0.7" rx="0.35" fill="#ffffff" opacity="0.22"/>
    <path d="M18.5 12.5 H24 A11.5 11.5 0 0 1 24 35.5 H18.5 Z" fill="none" stroke="url(#silver)" stroke-width="3.4" stroke-linejoin="round"/>
    <rect x="11" y="19.6" width="17.5" height="2.6" rx="1.3" fill="#3d6bff"/>
    <rect x="11" y="25.8" width="17.5" height="2.6" rx="1.3" fill="#3d6bff"/>
  </g>
  <text x="164" y="106" fill="#9aa6b8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="13" letter-spacing="3">EXPENSES DASHBOARD</text>

  <text x="70" y="226" fill="#f2f2ee" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="650" letter-spacing="-3.5">Desk</text>
  <text x="72" y="266" fill="#c9d0d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Every currency, one honest month.</text>
  <text x="72" y="304" fill="#9aa6b8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2.4">MULTI-USER  ·  MULTI-CURRENCY  ·  NOTION SYNC  ·  WEBHOOK CAPTURE</text>

  <!-- glass panel: month view -->
  <g transform="translate(724 52)">
    <rect width="404" height="256" rx="16" fill="#151a21" fill-opacity="0.66"/>
    <rect x="0.5" y="0.5" width="403" height="255" rx="15.5" fill="none" stroke="url(#edge)"/>

    <text x="24" y="38" fill="#9aa6b8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">OCTOBER · SPENT</text>
    <text x="24" y="72" fill="#f2f2ee" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="28" font-weight="600" style="font-variant-numeric: tabular-nums">£1,284.50</text>
    <text x="380" y="72" fill="#9aa6b8" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="13" style="font-variant-numeric: tabular-nums">of £1,500</text>

    <!-- bars on a 0..1 scale of each category's budget; tick = 100 % -->
    <g transform="translate(24 104)">
      <line x1="0" y1="124" x2="356" y2="124" stroke="#f2f2ee" stroke-opacity="0.14"/>
      <g fill="url(#bar)">
        <rect x="6"   y="46" width="34" height="78"  rx="6"/>
        <rect x="56"  y="16" width="34" height="108" rx="6"/>
        <rect x="106" y="64" width="34" height="60"  rx="6"/>
        <rect x="156" y="34" width="34" height="90"  rx="6"/>
        <rect x="256" y="72" width="34" height="52"  rx="6"/>
        <rect x="306" y="52" width="34" height="72"  rx="6"/>
      </g>
      <rect x="206" y="0" width="34" height="124" rx="6" fill="url(#over)"/>
      <g stroke="#f2f2ee" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="24" x2="44" y2="24"/>
        <line x1="52" y1="12" x2="94" y2="12"/>
        <line x1="102" y1="40" x2="144" y2="40"/>
        <line x1="152" y1="28" x2="194" y2="28"/>
        <line x1="202" y1="22" x2="244" y2="22"/>
        <line x1="252" y1="48" x2="294" y2="48"/>
        <line x1="302" y1="36" x2="344" y2="36"/>
      </g>
    </g>
  </g>
</svg>
