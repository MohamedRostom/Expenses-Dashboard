name: deploy-cf

# v1.* tags -> Stage 2 Cloudflare cut-over (roadmap Phase 6, T118): wrangler deploy the Worker,
# Pages deploy apps/web/dist, run the full e2e-ci suite against the Cloudflare preview, then a
# smoke check against the eventual custom domain.
#
# This IS the Phase 6 workflow, so CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required
# here for the first time (CLAUDE.md: "not needed until Phase 6"). Every job below is gated on
# them being present and fails loudly, not silently, when they're missing — expected until
# Rostom sets up a Cloudflare account (see CLAUDE.md "Rostom to-dos").
on:
  push:
    tags:
      - 'v1.*'

concurrency:
  group: deploy-cf

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set; the Cloudflare cut-over cannot deploy. Set them once Rostom's Cloudflare account exists (CLAUDE.md, Phase 6)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy-worker:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config infra/cloudflare/wrangler.toml

  deploy-pages:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @desk/web build
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=desk-web

  e2e-preview:
    needs: [deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @desk/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e -- --project=ci
        env:
          CI: 'true'
          # wrangler-action's deployment-url output is the Pages preview for this deploy; the
          # API worker's own deployment-url is used by the app internally via its own config,
          # not by these e2e specs, which talk to whichever origin serves the SPA.
          E2E_BASE_URL: ${{ needs.deploy-pages.outputs.deployment-url }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-preview-report
          path: tests/e2e/playwright-report
          retention-days: 7

  smoke-custom-domain:
    needs: e2e-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @desk/e2e exec playwright install --with-deps chromium
      # Placeholder domain — Rostom fills this in once DNS is decided (docs/runbooks/cutover.md).
      # Until then this step fails predictably (curl against a domain that doesn't resolve),
      # which is correct: there is no real custom domain to smoke-test yet.
      - run: curl --fail --retry 5 --retry-delay 5 https://desk.example.com/healthz
      - run: pnpm --filter @desk/e2e exec playwright test smoke.spec.ts --project=local
        env:
          E2E_LOCAL_BASE_URL: https://desk.example.com
          E2E_SEEDED_PASSWORD: ${{ secrets.E2E_SEEDED_PASSWORD }}
