name: deploy-preview

# One Fly app per PR (desk-pr-<number>), destroyed when the PR closes.
# Needs repo secrets FLY_API_TOKEN and PREVIEW_DATABASE_URL.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}

permissions:
  contents: read
  pull-requests: write

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  APP: desk-pr-${{ github.event.number }}

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl apps create "$APP" --org personal || true
      - run: flyctl secrets set --app "$APP" --stage DATABASE_URL="${{ secrets.PREVIEW_DATABASE_URL }}"
      - run: >-
          flyctl deploy . --app "$APP" --config infra/fly/fly.toml --dockerfile infra/fly/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }} --remote-only --strategy immediate --ha=false
      - run: >-
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none
          --body "Preview: https://$APP.fly.dev (sha ${{ github.sha }})"
        env:
          GH_TOKEN: ${{ github.token }}

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl apps destroy "$APP" --yes || true
