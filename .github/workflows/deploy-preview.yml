name: deploy-preview

# One Fly app per PR (ros-desk-pr-<number>), destroyed when the PR closes.
# Needs repo secrets FLY_API_TOKEN, PREVIEW_DATABASE_URL, PREVIEW_SESSION_SECRET and
# PREVIEW_SECRET_BOX_KEY.
# Repo variable PREVIEW_DEPLOYMENT_FLAG=false pauses new preview deploys (skipped, not failed);
# the destroy job below stays unconditional so closed PRs never leave an orphaned app running.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}

permissions:
  contents: read
  pull-requests: write

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  APP: ros-desk-pr-${{ github.event.number }}

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.PREVIEW_DEPLOYMENT_FLAG != 'false'
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN is not set; skipping the Fly preview deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.skip != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@1.6
      - if: steps.gate.outputs.skip != 'true'
        run: |
          if ! out=$(flyctl apps create "$APP" --org personal 2>&1); then
            echo "$out" | grep -qi 'already' || { echo "$out"; exit 1; }
          fi
      - if: steps.gate.outputs.skip != 'true'
        run: >-
          flyctl secrets set --app "$APP" --stage
          DATABASE_URL="${{ secrets.PREVIEW_DATABASE_URL }}"
          SESSION_SECRET="${{ secrets.PREVIEW_SESSION_SECRET }}"
          SECRET_BOX_KEY="${{ secrets.PREVIEW_SECRET_BOX_KEY }}"
          APP_ORIGIN="https://$APP.fly.dev"
      - if: steps.gate.outputs.skip != 'true'
        name: Mail secrets (Resend), only when PREVIEW_RESEND_API_KEY is set
        # Unset: the app keeps its SMTP fallback. MAIL_FROM defaults to Resend's sandbox sender,
        # which only delivers to the Resend account's own address (testing).
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            flyctl secrets set --app "$APP" --stage RESEND_API_KEY="$RESEND_API_KEY" MAIL_FROM="${MAIL_FROM:-onboarding@resend.dev}"
          fi
        env:
          RESEND_API_KEY: ${{ secrets.PREVIEW_RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.PREVIEW_MAIL_FROM }}
      - if: steps.gate.outputs.skip != 'true'
        run: >-
          flyctl deploy . --app "$APP" --config infra/fly/fly.toml --dockerfile infra/fly/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }} --remote-only --strategy immediate --ha=false
      - if: steps.gate.outputs.skip != 'true'
        run: >-
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none
          --body "Preview: https://$APP.fly.dev (sha ${{ github.sha }})"
        env:
          GH_TOKEN: ${{ github.token }}

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@1.6
      - if: env.FLY_API_TOKEN != ''
        run: |
          if ! out=$(flyctl apps destroy "$APP" --yes 2>&1); then
            echo "$out" | grep -qi 'could not find' || { echo "$out"; exit 1; }
          fi
