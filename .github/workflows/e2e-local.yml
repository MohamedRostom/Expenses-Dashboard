name: e2e-local

# Suites that need real accounts, real devices or OAuth round-trips. Runs on Rostom's
# self-hosted runner (label desk-local), nightly and on demand, only from main, never
# blocking a PR. Secrets live in the approval-gated environment `local-secrets`. Off until the
# repository variable E2E_LOCAL_ENABLED is 'true', so nightly runs do not queue for a runner
# that is not registered yet.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: e2e-local
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  e2e-local:
    if: github.ref == 'refs/heads/main' && vars.E2E_LOCAL_ENABLED == 'true'
    runs-on: [self-hosted, desk-local]
    environment: local-secrets
    timeout-minutes: 60
    steps:
      # Ensure Git for Windows is in PATH before checkout so it uses git clone (not REST API)
      # This must run before checkout to affect the checkout action's git detection
      - if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Real accounts come from one secret holding the whole YAML file; without it every
      # account-dependent spec skips (tests/e2e/fixtures/test-accounts.ts).
      - name: Write test accounts file
        shell: pwsh
        env:
          E2E_TEST_ACCOUNTS_YAML: ${{ secrets.E2E_TEST_ACCOUNTS_YAML }}
        run: |
          if ($env:E2E_TEST_ACCOUNTS_YAML) {
            Set-Content -Path "tests/e2e/test-accounts.local.yaml" -Value $env:E2E_TEST_ACCOUNTS_YAML -NoNewline
            Write-Host "Test accounts file written."
          } else {
            Write-Host "No E2E_TEST_ACCOUNTS_YAML secret: account-dependent tests will be skipped."
          }
      - run: pnpm --filter @desk/e2e exec playwright test --project=local --pass-with-no-tests
        shell: pwsh
        env:
          CI: 'true'
          E2E_LOCAL_BASE_URL: ${{ vars.E2E_LOCAL_BASE_URL }}
      - if: always()
        shell: pwsh
        run: Remove-Item -Path "tests/e2e/test-accounts.local.yaml" -Force -ErrorAction SilentlyContinue
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-local
          path: tests/e2e/playwright-report
          retention-days: 14
      - if: failure()
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          gh issue create --title "e2e-local failed on $date" --label "area:tests" --body "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
