name: deploy-staging

# main -> desk-staging.fly.dev. Needs repo secrets FLY_API_TOKEN and STAGING_DATABASE_URL.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl secrets set --config infra/fly/fly.toml --stage DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}"
      - run: >-
          flyctl deploy . --config infra/fly/fly.toml --dockerfile infra/fly/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }} --remote-only --ha=false
      - run: curl --fail --retry 5 --retry-delay 5 https://desk-staging.fly.dev/healthz
