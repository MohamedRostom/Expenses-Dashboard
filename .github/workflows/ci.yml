name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'infra/**'
              - 'tests/**'
              - '.github/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.prettier*'

  lint:
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm audit --audit-level high
      - run: pnpm --filter @desk/contracts generate:openapi
      - run: git diff --exit-code packages/contracts/openapi.json

  typecheck:
    timeout-minutes: 10
    needs: [lint, detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    timeout-minutes: 10
    needs: [typecheck, detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  api:
    timeout-minutes: 20
    needs: [unit, detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:api

  worker-build:
    timeout-minutes: 10
    needs: [api, detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm worker:build

  e2e-ci:
    timeout-minutes: 30
    needs: [worker-build, detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @desk/e2e exec playwright install --with-deps chromium
      - run: docker compose -f infra/docker-compose.yml up --build --wait
        env:
          GIT_SHA: ${{ github.sha }}
      - run: pnpm test:e2e --project=ci
        env:
          CI: 'true'
      - run: pnpm --filter @desk/e2e lighthouse
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
      # Was "temporary-public-storage" (LHCI's own hosted service) — the reports include full
      # page content/screenshots, and this is a private product. Kept as a normal (private,
      # repo-scoped) Actions artifact instead.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: tests/e2e/lighthouse-reports
          retention-days: 7
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
