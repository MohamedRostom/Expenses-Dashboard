name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'infra/**'
              - 'tests/**'
              - '.github/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            config:
              - '.github/workflows/**'
              - '.github/actions/**'

  lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    needs: [lint, detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    needs: [typecheck, detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  api:
    needs: [unit, detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:api

  worker-build:
    needs: [api, detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm worker:build

  e2e-ci:
    needs: [worker-build, detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @desk/e2e exec playwright install --with-deps chromium
      - run: docker compose -f infra/docker-compose.yml up --build --wait
        env:
          GIT_SHA: ${{ github.sha }}
      - run: pnpm test:e2e -- --project=ci
        env:
          CI: 'true'
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
