name: deploy-fly

# v0.* tags -> deploy to ros-desk-staging, smoke test, promote the same build to ros-desk-production.
# App names prefixed "ros-" to avoid a global Fly.io name collision (2026-09-20).
# v1.* tags go to deploy-cf.yml instead (Cloudflare cut-over, T118) — this workflow ignores them.
# Needs repo secrets FLY_API_TOKEN, STAGING_DATABASE_URL, STAGING_SESSION_SECRET,
# STAGING_SECRET_BOX_KEY and (for the promote step) PRODUCTION_DATABASE_URL,
# PRODUCTION_SESSION_SECRET, PRODUCTION_SECRET_BOX_KEY. ros-desk-production already exists
# (Rostom ran `fly apps create ros-desk-production --org personal`).
# Repo variable DEPLOYMENT_FLAG=false pauses the whole pipeline (skipped, not failed) — shared
# with deploy-staging.yml.
on:
  push:
    tags:
      - 'v0.*'

concurrency:
  group: deploy-fly

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    # smoke-staging and promote-production below `needs:` this job, so DEPLOYMENT_FLAG=false
    # here skips the entire pipeline, not just this job.
    if: "!startsWith(github.ref_name, 'v1.') && vars.DEPLOYMENT_FLAG != 'false'"
    steps:
      - id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN is not set; this tag push will fail at the flyctl step below — that's expected until Rostom configures Fly (see CLAUDE.md)"
          fi
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "::error::STAGING_DATABASE_URL is not set; refusing to overwrite the live secret"
            exit 1
          fi
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: >-
          flyctl secrets set --config infra/fly/fly.toml --stage
          DATABASE_URL="$STAGING_DATABASE_URL"
          SESSION_SECRET="$STAGING_SESSION_SECRET"
          SECRET_BOX_KEY="$STAGING_SECRET_BOX_KEY"
          APP_ORIGIN="https://ros-desk-staging.fly.dev"
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
          STAGING_SECRET_BOX_KEY: ${{ secrets.STAGING_SECRET_BOX_KEY }}
      - name: Mail secrets (Resend), only when STAGING_RESEND_API_KEY is set
        # Unset: the app keeps its SMTP fallback. MAIL_FROM defaults to Resend's sandbox sender,
        # which only delivers to the Resend account's own address (testing).
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            flyctl secrets set --config infra/fly/fly.toml --stage RESEND_API_KEY="$RESEND_API_KEY" MAIL_FROM="${MAIL_FROM:-onboarding@resend.dev}"
          fi
        env:
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.STAGING_MAIL_FROM }}
      - run: >-
          flyctl deploy . --config infra/fly/fly.toml --dockerfile infra/fly/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }} --remote-only --ha=false
      - run: curl --fail --retry 5 --retry-delay 5 https://ros-desk-staging.fly.dev/healthz

  smoke-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @desk/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @desk/e2e exec playwright test smoke.spec.ts --project=local
        env:
          E2E_LOCAL_BASE_URL: https://ros-desk-staging.fly.dev
          E2E_SEEDED_PASSWORD: ${{ secrets.E2E_SEEDED_PASSWORD }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-staging-report
          path: tests/e2e/playwright-report
          retention-days: 7

  # Promotes the exact image just proven on staging to ros-desk-production (already created).
  promote-production:
    needs: smoke-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - id: gate
        run: |
          if [ -z "$PRODUCTION_DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not set; refusing to overwrite the live secret"
            exit 1
          fi
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: >-
          flyctl secrets set --app ros-desk-production --stage
          DATABASE_URL="$PRODUCTION_DATABASE_URL"
          SESSION_SECRET="$PRODUCTION_SESSION_SECRET"
          SECRET_BOX_KEY="$PRODUCTION_SECRET_BOX_KEY"
          APP_ORIGIN="https://ros-desk-production.fly.dev"
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_SESSION_SECRET: ${{ secrets.PRODUCTION_SESSION_SECRET }}
          PRODUCTION_SECRET_BOX_KEY: ${{ secrets.PRODUCTION_SECRET_BOX_KEY }}
      - name: Mail secrets (Resend), only when PRODUCTION_RESEND_API_KEY is set
        # Unset: the app keeps its SMTP fallback. MAIL_FROM defaults to Resend's sandbox sender,
        # which only delivers to the Resend account's own address (testing).
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            flyctl secrets set --app ros-desk-production --stage RESEND_API_KEY="$RESEND_API_KEY" MAIL_FROM="${MAIL_FROM:-onboarding@resend.dev}"
          fi
        env:
          RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.PRODUCTION_MAIL_FROM }}
      # Remember the live image so a failed promote can redeploy it (flyctl has no `releases
      # rollback`). Empty on the very first deploy: nothing to roll back to.
      - id: previous
        run: echo "image=$(flyctl releases --app ros-desk-production --image --json | jq -r '.[0].ImageRef // empty')" >> "$GITHUB_OUTPUT"
      # --config is required: without it flyctl rebuilds the config from existing machines,
      # which fails on an app that has none. --app overrides the staging name in the file.
      - run: >-
          flyctl deploy . --config infra/fly/fly.toml --app ros-desk-production
          --dockerfile infra/fly/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }} --remote-only --ha=false
      - id: promote-check
        run: curl --fail --retry 5 --retry-delay 5 https://ros-desk-production.fly.dev/healthz
      # Rollback: on any failure above, redeploy the previous image. Manually:
      #   flyctl deploy --config infra/fly/fly.toml --app ros-desk-production --image <ImageRef>
      # (ImageRef from `flyctl releases --app ros-desk-production --image`).
      - if: failure() && steps.previous.outputs.image != ''
        run: >-
          flyctl deploy --config infra/fly/fly.toml --app ros-desk-production
          --image "${{ steps.previous.outputs.image }}" --ha=false
