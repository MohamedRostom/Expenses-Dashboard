name: codeql

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - '.specify/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - '.specify/**'
      - '*.md'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    # Code scanning needs a public repo or GitHub Advanced Security; the job
    # activates itself the moment the repository goes public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
