packages:
  - apps/*
  - packages/*
  - tests/*
  - infra/mocks

# Native postinstall scripts pnpm may run (it blocks all others by default).
allowBuilds:
  esbuild: true
  workerd: true
  ssh2: true
  cpu-features: true
  protobufjs: true

# Transitive-only vulnerable deps (nodemailer is a direct dep — bumped in apps/api/package.json
# instead of overridden here). extract-zip (via tests/e2e's @lhci/cli->lighthouse->puppeteer-core)
# has two high advisories (GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3) with no patched version as of
# 2026-09-20 — `pnpm audit --fix` can't override it either; see ci.yml's `lint` job comment.
overrides:
  esbuild@<=0.24.2: ^0.25.0
  tmp@<0.2.6: ^0.2.6
  tmp@<=0.2.3: ^0.2.4
  uuid@<11.1.1: ^11.1.1

auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
