packages:
  - apps/*
  - packages/*
  - tests/*
  - infra/mocks

# Native postinstall scripts pnpm may run (it blocks all others by default).
allowBuilds:
  esbuild: true
  workerd: true
  ssh2: true
  cpu-features: true
  protobufjs: true

# Transitive-only vulnerable deps (nodemailer is a direct dep — bumped in apps/api/package.json
# instead of overridden here). extract-zip (via tests/e2e's @lhci/cli->lighthouse->puppeteer-core)
# has two high advisories (GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3) with no patched version as of
# 2026-09-20 — `pnpm audit --fix` can't override it either; see ci.yml's `lint` job comment.
overrides:
  basic-ftp@<=6.2.0: ^6.2.1
  esbuild@<=0.24.2: ^0.25.0
  tmp@<0.2.6: ^0.2.6
  tmp@<=0.2.3: ^0.2.4
  uuid@<11.1.1: ^11.1.1
  # sharp <0.35.5 ships a vulnerable librsvg (GHSA-wq5f-xc86-pv6w / CVE-2026-96889).
  # Patched in sharp >=0.35.5; miniflare->sharp is transitive via wrangler, so override
  # sharp here rather than bumping wrangler/miniflare (0.35.x is API-stable).
  sharp@<0.35.5: ^0.35.5
  # undici <8.12.2 and <7.30.1: DoS, cache poisoning and TLS advisories (high); transitive via jsdom, testcontainers and wrangler.
  'undici@>=8.0.0 <8.12.2': ^8.12.2
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  # zod <4.6.6 memory exhaustion (GHSA-mrhx-c7xc-m3w5); body-parser <1.20.9 DoS (GHSA-27r3-jxmh-p828, via @lhci/cli).
  'zod@>=4.0.0 <4.6.6': ^4.6.6
  body-parser@<1.20.9: ^1.20.9

auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # zod 3.x has no fix for GHSA-mrhx-c7xc-m3w5; only @lhci/cli > lighthouse > chromium-bidi uses it
    # (e2e devDependency, never shipped, validates Chrome's own protocol messages). App zod 4 is overridden to ^4.6.6.
    - GHSA-mrhx-c7xc-m3w5
