# Full local stack, also what e2e-ci runs against:
#   docker compose -f infra/docker-compose.yml up --build --wait
# web (Vite dev server) on :5173 proxies /healthz to api on :3000.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U desk -d desk']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/fly/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-compose}
    environment:
      DATABASE_URL: postgres://desk:desk@postgres:5432/desk
      SMTP_URL: smtp://mailpit:1025
      NOTION_API_BASE: http://mocks:4000/notion
      GOOGLE_API_BASE: http://mocks:4000/google
      # T036: same mock mount for both — googleOAuthEndpoints()/microsoftOAuthEndpoints() in
      # apps/api/src/lib/credential.ts append the real providers' distinct authorize/token/revoke
      # paths onto whatever base they're given, and infra/mocks/src/google.ts and graph.ts serve
      # those paths alongside the calendar API at their one mount, so one mock base covers both.
      GOOGLE_OAUTH_BASE: http://mocks:4000/google
      GRAPH_API_BASE: http://mocks:4000/graph
      MICROSOFT_LOGIN_BASE: http://mocks:4000/graph
      # T029 fix: the OAuth authorize URL is sent to the browser as a 302 redirect, so unlike the
      # bases above (server-to-server, resolved by the api container's own DNS) it needs a
      # hostname the host browser can resolve too. `mocks` is published on 4000:4000, so
      # localhost:4000 reaches the same server from the host.
      GOOGLE_OAUTH_BROWSER_BASE: http://localhost:4000/google
      MICROSOFT_LOGIN_BROWSER_BASE: http://localhost:4000/graph
      CALDAV_TEST_URL: http://mocks:4000/caldav
      IMAP_TEST_HOST: mocks
      # Dev-only fixed OAuth client values so the api service can complete the connect flow
      # against the mocks (T036) — never reuse these outside compose/e2e-ci.
      GOOGLE_PANELS_CLIENT_ID: dev-google-panels-client-id
      GOOGLE_PANELS_CLIENT_SECRET: dev-google-panels-client-secret
      MICROSOFT_CLIENT_ID: dev-microsoft-client-id
      MICROSOFT_CLIENT_SECRET: dev-microsoft-client-secret
      # C10/Important-fix: without this, e2e-ci hits the live frankfurter.app API on every run.
      # Override with `RATES_PROVIDER=live` on the host env when manually testing real conversion
      # rates against the live API instead of the fixed-date FakeRates fixtures.
      RATES_PROVIDER: ${RATES_PROVIDER:-fake}
      # Dev-only fixed values — never reuse these outside compose/e2e-ci.
      SESSION_SECRET: dev-session-secret-not-for-production-use-000000
      SECRET_BOX_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_ORIGIN: http://localhost:5173
      # e2e-ci signs up every test's user from one IP; the default 20/hour cuts the suite short.
      REGISTER_IP_LIMIT_PER_HOUR: '1000'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # distroless has no shell or curl; node is the only binary.
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: infra/fly/Dockerfile
      target: deps
    command: pnpm --filter @desk/web dev --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Production build + vite preview, dedicated to the Lighthouse performance budget check
  # (tests/e2e/lighthouserc.json) — a score measured against the `web` service's dev server
  # above (unminified, unbundled, HMR overhead) is structurally meaningless, never mind >=0.9.
  # Separate from `web` (which Playwright tests run against) so this never risks that suite.
  web-preview:
    build:
      context: ..
      dockerfile: infra/fly/Dockerfile
      target: deps
    # No `--` before --host: pnpm forwards extra args as-is, so vite would receive a literal `--`,
    # stop parsing options there, and bind localhost only (healthcheck + host port both fail).
    command: sh -c "pnpm --filter @desk/web build && pnpm --filter @desk/web preview --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - '4173:4173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  landing:
    build:
      context: ..
      dockerfile: infra/fly/Dockerfile
      target: deps
    # No `--` before --host: pnpm forwards extra args as-is, so vite would receive a literal `--`,
    # stop parsing options there, and bind localhost only (healthcheck + host port both fail).
    command: sh -c "pnpm --filter @desk/landing build && pnpm --filter @desk/landing preview --host 0.0.0.0"
    ports:
      - '5174:5174'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5174/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Mock connectors (frankfurter, Notion) arrive with their phases; frozen clock lives here from Phase 1.
  mocks:
    build:
      context: ..
      dockerfile: infra/fly/Dockerfile
      target: deps
    command: pnpm --filter @desk/mocks start
    environment:
      PORT: 4000
    ports:
      - '4000:4000'

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
