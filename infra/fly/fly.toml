# Stage 1 staging app. Deploy from the repository root:
#   flyctl deploy . --config infra/fly/fly.toml --dockerfile infra/fly/Dockerfile
# Preview apps per PR reuse this file with --app desk-pr-<number>.
app = "desk-staging"
primary_region = "lhr"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Background jobs (currency change, rate warm/retry, housekeeping, Notion sync) primarily run
# in-process: node.ts (this http_service) polls runDueJobs() on a 30s interval as long as at
# least one machine is up (see apps/api/src/node.ts). C13: that stalls if the last machine
# scales to zero (min_machines_running = 0 above) or restarts mid-cycle, so
# .github/workflows/jobs-safety-net.yml runs `flyctl machine run <image> dist/tick.js` hourly as
# a backstop — dist/tick.js (built by `pnpm --filter @desk/api build`) is a single Node script
# with its own DB wiring, so it needs neither a shell nor pnpm inside the distroless runtime
# image (ssh console -C isn't available there).
#
# T114: nightly backup (infra/fly/backup.sh, pg_dump to Cloudflare R2) needs actual shell/pg_dump
# tooling the distroless image doesn't have — it runs from a separate Postgres-tooling image via
# the same `flyctl machine run` approach, not `ssh console` into this app's machine. See
# docs/runbooks/restore.md for the restore procedure.
