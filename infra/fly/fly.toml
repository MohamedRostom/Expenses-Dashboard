# Stage 1 staging app. Deploy from the repository root:
#   flyctl deploy . --config infra/fly/fly.toml --dockerfile infra/fly/Dockerfile
# Preview apps per PR reuse this file with --app desk-pr-<number>.
app = "desk-staging"
primary_region = "lhr"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
